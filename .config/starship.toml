# Starship prompt config — two-line, colorful, nerd font

format = """
$os $username$hostname$directory $git_branch$git_status$golang$nodejs$python$rust$docker_context$cmd_duration $time
$battery$status$character"""

palette = "custom"

[palettes.custom]
sky = "#7aa2f7"
mint = "#9ece6a"
peach = "#ff9e64"
rose = "#f7768e"
grape = "#bb9af7"
foam = "#73daca"

[os]
disabled = false
style = "bold grape"

[os.symbols]
Macos = ""
Linux = "🐧"
Windows = ""

[username]
show_always = false
format = "[$user]($style) "
style_user = "bold mint"
style_root = "bold rose"

[hostname]
ssh_only = true
format = "at [$hostname]($style) "
style = "bold peach"

[directory]
truncation_length = 8
truncate_to_repo = true
style = "bold sky"
read_only = " 󰌾"
home_symbol = "󰋜 ~"

[git_branch]
format = "[$symbol$branch]($style)"
symbol = " "
style = "bold foam"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold rose"
modified = "  ${count}"
untracked = " 󰋗 ${count}"
staged = " 󰸞 ${count}"
deleted = " 󰆴 ${count}"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇡${ahead_count}⇣${behind_count}"
stashed = " 󰏗 ${count}"
conflicted = " 󰞇 ${count}"

[golang]
format = " [$symbol$version]($style)"
symbol = " "
style = "bold cyan"

[nodejs]
format = " [$symbol$version]($style)"
symbol = "󰎙 "
style = "bold green"

[python]
format = " [$symbol$version( $virtualenv)]($style)"
symbol = "󰌠 "
style = "bold yellow"

[rust]
format = " [$symbol$version]($style)"
symbol = "󱘗 "
style = "bold red"

[docker_context]
format = " [$symbol$context]($style)"
symbol = "󰡨 "
style = "bold blue"

[cmd_duration]
min_time = 3_000
format = " [󱎫 $duration]($style)"
style = "bold peach"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "dimmed white"

[battery]
disabled = false
format = "[$symbol$percentage]($style) "

[[battery.display]]
threshold = 20
style = "bold rose"
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "

[status]
disabled = false
format = "[✘ $status]($style) "
style = "bold rose"

[character]
success_symbol = "[❯](bold mint)"
error_symbol = "[❯](bold rose)"
vimcmd_symbol = "[❮](bold grape)"
