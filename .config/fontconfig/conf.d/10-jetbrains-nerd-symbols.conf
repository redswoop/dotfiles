<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Tracked in dotfiles. Fonts themselves come from dotfiles-bootstrap. -->
<fontconfig>
  <!-- Anything that asks for plain "monospace" gets the coding font -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Symbols Nerd Font Mono</family>
      <family>FreeMono</family>
    </prefer>
  </alias>

  <!-- Glyph fallbacks for JetBrains Mono: Nerd icons, then FreeMono for the
       misc-technical symbols (⏵ ⎿ ⏺) so a proportional font doesn't win -->
  <match target="pattern">
    <test name="family"><string>JetBrains Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
      <string>FreeMono</string>
    </edit>
  </match>
</fontconfig>
