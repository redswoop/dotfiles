[main]
font=JetBrains Mono:size=10,Symbols Nerd Font Mono:size=10,FreeMono:size=10,Noto Color Emoji:size=10
pad=6x4
term=xterm-256color

[scrollback]
lines=20000

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors]
# Tomorrow Night
background=1d1f21
foreground=c5c8c6
regular0=1d1f21
regular1=cc6666
regular2=b5bd68
regular3=f0c674
regular4=81a2be
regular5=b294bb
regular6=8abeb7
regular7=c5c8c6
bright0=969896
bright1=de935f
bright2=b5bd68
bright3=f0c674
bright4=81a2be
bright5=b294bb
bright6=8abeb7
bright7=ffffff

[key-bindings]
clipboard-copy=Control+Shift+c Mod4+c XF86Copy
clipboard-paste=Control+Shift+v Mod4+v XF86Paste
font-increase=Control+plus Control+equal Mod4+equal
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+n Mod4+n
search-start=Control+Shift+r
